output: dist/
releases:
  - name: prod
    jobs:
      - name: release-windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            dart-define:
              APP_ENV: production
      - name: release-windows-zip
        package:
          platform: windows
          target: zip
          build_args:
            dart-define:
              APP_ENV: production